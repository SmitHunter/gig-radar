[project]
name = "gig-radar"
version = "0.1.0"
description = "Get told about gigs before the tickets drop."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gig-radar = "gig_radar.main:run"

[tool.setuptools.packages.find]
include = ["gig_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
